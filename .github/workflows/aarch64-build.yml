name: aarch64 ISO Build

# The aarch64 twin of nightly-build.yml. It builds the [omarchy] aarch64
# package repository first (omarchy-pkgs' reusable workflow, same run), then
# the ISO natively on a GitHub-hosted arm64 runner with that repo mounted in
# place of pkgs.omarchy.org, which serves no aarch64 tree. Nothing here
# changes the x86_64 workflow: separate file, separate runner label.

on:
  workflow_dispatch:
    inputs:
      pkgs_ref:
        description: "omarchy-pkgs branch, tag or SHA to build the [omarchy] repo from"
        type: string
        default: master
      iso_make_args:
        description: "Extra bin/omarchy-iso-make arguments (e.g. --edge)"
        type: string
        default: ""

jobs:
  packages:
    uses: omacom-io/omarchy-pkgs/.github/workflows/build-aarch64.yml@master
    with:
      pkgs_repository: omacom-io/omarchy-pkgs
      pkgs_ref: ${{ inputs.pkgs_ref || 'master' }}
      # Everything the ISO installs from [omarchy] that has an aarch64 build.
      # quickshell-git is deliberately absent: the aarch64 package selection
      # substitutes Arch Linux ARM's quickshell package for it.
      packages: >-
        omarchy-keyring ttf-jetbrains-mono-nerd-basic limine-mkinitcpio-hook limine-snapper-sync
        qcom-firmware-extract omarchy-settings omarchy omarchy-nvim
        aether cliamp herdr localsend-bin mise-bin omacalc omacut omawrite omarchy-chromium-bin
        ttfx yay tobi-try ttf-ia-writer ufw-docker xdg-terminal-exec yaru-icon-theme
        tzupdate tensaku hyprland-preview-share-picker

  build-iso:
    needs: packages
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 330
    env:
      ISO_MAKE_ARGS: ${{ inputs.iso_make_args }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Runner facts
        run: |
          set -x
          uname -a
          nproc
          free -h
          df -h
          docker version --format '{{.Server.Version}}'
          docker info --format '{{.Driver}} {{.DockerRootDir}}'

      # The hosted runner's root disk is small; the x86 nightly frees it the
      # same way. Keep going if a step of it has nothing to remove on arm64.
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@v1.3.1
        continue-on-error: true

      - name: Disk after cleanup
        run: df -h

      - name: Download the aarch64 [omarchy] repository
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.packages.outputs.artifact }}
          path: omarchy-repo

      - name: Inspect the repository
        run: |
          test -f omarchy-repo/omarchy.db
          ls -la omarchy-repo | head -50
          du -sh omarchy-repo

      - name: Build ISO
        run: |
          re='^[A-Za-z0-9 ._=/-]*$'
          [[ $ISO_MAKE_ARGS =~ $re ]] || { echo "invalid iso_make_args" >&2; exit 1; }
          start=$(date +%s)
          NO_BOOT_OFFER=1 ./bin/omarchy-iso-make --keep-pkg-cache --local-repo "$PWD/omarchy-repo" $ISO_MAKE_ARGS
          echo "ISO build wall-clock: $(( $(date +%s) - start ))s"

      - name: Inspect ISO
        run: |
          sudo apt-get install -y -qq xorriso >/dev/null
          ls -l release/
          for iso in release/*.iso; do
            echo "== $iso"
            sha256sum "$iso"
            xorriso -indev "$iso" -ls /EFI/BOOT/ 2>/dev/null
            xorriso -indev "$iso" -lsl /arch/boot/aarch64/ 2>/dev/null
            # This is the default Snapdragon boot target. Its absence leaves
            # only the plain-kernel fallback, which has no board device tree.
            xorriso -indev "$iso" -ls /arch/boot/aarch64/omarchy-live.efi 2>/dev/null \
              || { echo "ISO is missing the DTB-carrying live UKI" >&2; exit 1; }
          done
          df -h

      - name: Upload newly built ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: omarchy-iso-aarch64-${{ github.run_number }}
          path: ./release/*.iso
          if-no-files-found: error
          retention-days: 3
